<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Texture Preview - 3D Snake</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: #1a1a1a;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 1.5rem;
        }
        p {
            color: #999;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        #preview-container {
            width: 100%;
            max-width: 900px;
            height: 500px;
            border-radius: 12px;
            overflow: hidden;
            background: #0a0a0a;
        }
        #labels {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
            max-width: 900px;
            justify-content: center;
        }
        .label {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <h1>Texture Preview</h1>
    <p>Drag to rotate • Scroll to zoom • Use <strong>npm run dev</strong> (not build) to see texture changes</p>
    <p>
        <a href="/" style="color: #6af;">← Back to Game</a>
        <span style="margin: 0 12px;">|</span>
        <button onclick="location.reload(true)" style="padding:6px 12px;background:#333;color:#6af;border:1px solid #6af;border-radius:6px;cursor:pointer;font-size:13px;">Refresh Textures</button>
    </p>
    <div id="preview-container"></div>
    <div style="margin-top:12px;">
        <div style="color:#888;font-size:12px;margin-bottom:4px;">Apple texture (2D flat):</div>
        <div id="apple-flat-preview"></div>
    </div>
    <div id="labels">
        <div class="label">Snake (body)</div>
        <div class="label">Apple</div>
        <div class="label">Powerup: Immunity</div>
        <div class="label">Powerup: Slow</div>
        <div class="label">Hawk (cone)</div>
    </div>
    <script type="module" src="src/texture-preview.js?v=3"></script>
</body>
</html>
